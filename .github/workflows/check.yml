# Проверка без публикации: push в develop и pull request в main.
# Сайт выкладывается только из main (deploy.yml): выложить — влить develop в main.
name: Проверка

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Новый push отменяет проверку предыдущего — нужна только последняя.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
